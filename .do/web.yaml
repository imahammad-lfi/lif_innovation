# DigitalOcean App Platform spec: Linkfields website (Next.js 16).
# Guide: docs/DEPLOY-DIGITALOCEAN.md. Paste into Apps › linkfields-web › Settings › App Spec › Edit.
# Replace every CHANGE_ME and enter the SECRET values (DigitalOcean encrypts them on save).
# Deploy the CMS first: the build reads every page from it, so STRAPI_URL must answer during the build.
name: linkfields-web
region: lon

services:
  - name: web
    github:
      repo: imahammad-lfi/lif_innovation
      branch: main
      deploy_on_push: false # deploys are manual: Actions › Deploy
    source_dir: apps/web
    dockerfile_path: apps/web/Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
    envs:
      # Build-time values are passed to the Dockerfile as build arguments.
      - { key: CONTENT_SOURCE, value: strapi, scope: RUN_AND_BUILD_TIME }
      # Public CMS address (the linkfields-cms app's URL, or https://cms.linkfields.com once the domain is set).
      - { key: STRAPI_URL, value: "https://CHANGE_ME_CMS", scope: RUN_AND_BUILD_TIME }
      # Canonical site address (links, sitemap, social cards). A fixed value: ${APP_URL} is empty during the build.
      - { key: NEXT_PUBLIC_SITE_URL, value: "https://www.linkfields.com", scope: RUN_AND_BUILD_TIME }
      # Spaces CDN host that serves the CMS media (no https://).
      - { key: MEDIA_HOSTS, value: CHANGE_ME_BUCKET.lon1.cdn.digitaloceanspaces.com, scope: RUN_AND_BUILD_TIME }
      # Same value as WEBSITE_REVALIDATE_SECRET in the CMS app.
      - { key: REVALIDATE_SECRET, type: SECRET, value: CHANGE_ME, scope: RUN_TIME }
      # CMS › Settings › API Tokens › website-leads › Regenerate (on the DigitalOcean CMS).
      - { key: STRAPI_LEAD_TOKEN, type: SECRET, value: CHANGE_ME, scope: RUN_TIME }
      # Optional but recommended (Cloudflare Turnstile, free): spam protection for the contact form.
      - { key: NEXT_PUBLIC_TURNSTILE_SITE_KEY, value: "", scope: RUN_AND_BUILD_TIME }
      - { key: TURNSTILE_SECRET_KEY, type: SECRET, value: "", scope: RUN_TIME }

ingress:
  rules:
    - component: { name: web }
      match: { path: { prefix: / } }
